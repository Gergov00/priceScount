name: pricescount-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricescount_test
      POSTGRES_PASSWORD: pricescount_test
      POSTGRES_DB: pricescount_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricescount_test -d pricescount_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-alpine
    hostname: pricescount-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pricescount_test
      RABBITMQ_DEFAULT_PASS: pricescount_test
      RABBITMQ_NODENAME: rabbit@pricescount-test-rabbitmq
    ports:
      - "127.0.0.1::5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
