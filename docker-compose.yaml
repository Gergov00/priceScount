services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: pricescount-rabbitmq
    ports:
      # bound to localhost only — never expose the broker to the network
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pricescount}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pricescount}
      # Keep this identical to the nodename of any broker data being restored.
      RABBITMQ_NODENAME: rabbit@pricescount-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricescount
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricescount}
      POSTGRES_DB: pricescount
    ports:
      # bound to localhost only — never expose the database to the network
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricescount -d pricescount"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://pricescount:${POSTGRES_PASSWORD:-pricescount}@postgres:5432/pricescount?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pricescount}:${RABBITMQ_PASSWORD:-pricescount}@rabbitmq:5672/
    ports:
      # localhost only: the API is internal (Bot reaches it via the docker network)
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pricescount}:${RABBITMQ_PASSWORD:-pricescount}@rabbitmq:5672/
      POSTGRES_DSN: postgresql://pricescount:${POSTGRES_PASSWORD:-pricescount}@postgres:5432/pricescount?sslmode=disable
      CHECK_INTERVAL_MINUTES: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  extractor:
    build:
      context: .
      dockerfile: services/extractor/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pricescount}:${RABBITMQ_PASSWORD:-pricescount}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pricescount}:${RABBITMQ_PASSWORD:-pricescount}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    env_file:
      - .env
    environment:
      GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
